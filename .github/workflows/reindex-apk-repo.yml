# ==============================================================================
# PonWrt apk 软件仓库：自动验签 / 补签 + 重建签名索引（按目录分组）
# ------------------------------------------------------------------------------
# 目录结构（apk 的兼容键是 arch + libc + 内核 vermagic，与机型无关，所以主目录
# 按内核版本分；机型差异用 common / usb 两个索引表达）：
#
#   aarch64_cortex-a53/ponwrt-k<kver>/<common|usb|wifi|bt>/  按机型能力分组
#
# 两条索引分支各跑一遍：repo（主线）与 repo-wed（WED 实验固件）。
# 每个目录各自一份 packages.adb（本钥签名），互不覆盖。
# 作用：
#   1) 扫描每个目录里的 .apk，用固定公钥逐个验签；不是本钥签发就地重签；
#   2) 每个目录各建一份 packages.adb（修掉多工作流互相覆盖索引的老问题）；
#   3) 重算 SHA256SUMS；
#   4) 包集合与索引内容都没变时不提交。
#
# 触发：定时（每 2 小时）+ 手动 + 上游 build 工作流 repository_dispatch(reindex)
# 定位：兜底。正常发布由 pkg-publish.yml 在入库时自己重签索引，本工作流只负责
#   修「手工塞进仓的包 / 发布中断留下的索引漂移」，并给两条分支各自的目录补签。
#
# 设备侧：/etc/apk/repositories.d/*.list 里写「索引文件完整 URL」：
#   https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo/repo/aarch64_cortex-a53/ponwrt-k6.18.60/common/packages.adb
#   （apk v3 对裸 URL 会当成 v2 目录源去取 <url>/<arch>/APKINDEX.tar.gz，必须指到 packages.adb）
#   公钥放 /etc/apk/keys/public-key.pem
# ==============================================================================

name: Reindex apk repository (verify + sign + index)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "强制重建索引并提交（忽略幂等判断）"
        type: boolean
        default: false
  schedule:
    - cron: "0 */2 * * *"
  repository_dispatch:
    types: [reindex]

permissions:
  contents: write

env:
  APK_TOOLS_VER: "3.0.8"
  ARCH_ROOT: "aarch64_cortex-a53"

jobs:
  reindex:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        branch: [repo, repo-wed]
    # 与 fw-publish / pkg-publish 共用同一把写锁（按索引分支区分），避免同分支并发推送
    concurrency:
      group: apk-repo-write-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout repo branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Install signing key
        env:
          APK_SIGNING_PRIVATE_KEY: ${{ secrets.APK_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APK_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::仓库未配置 APK_SIGNING_PRIVATE_KEY，无法签名索引（设备会报 UNTRUSTED），本轮中止"
            exit 1
          fi
          printf '%s\n' "$APK_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/private-key.pem"
          chmod 600 "$RUNNER_TEMP/private-key.pem"
          mkdir -p "$RUNNER_TEMP/keys"
          openssl ec -in "$RUNNER_TEMP/private-key.pem" -pubout -out "$RUNNER_TEMP/keys/public-key.pem" 2>/dev/null
          sha256sum "$RUNNER_TEMP/keys/public-key.pem"
          # 仓库根的公钥必须与私钥推导出来的一致，否则设备信任链断
          if [ -f public-key.pem ] && ! cmp -s public-key.pem "$RUNNER_TEMP/keys/public-key.pem"; then
            echo ">>> 仓库根 public-key.pem 与私钥不匹配，更新为新公钥"
            cp -f "$RUNNER_TEMP/keys/public-key.pem" public-key.pem
          fi

      - name: Build apk-tools (static)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev zlib1g-dev libzstd-dev meson ninja-build >/dev/null
          cd "$RUNNER_TEMP"
          curl -sSL -o apk-tools.tar.gz \
            "https://codeload.github.com/alpinelinux/apk-tools/tar.gz/refs/tags/v${APK_TOOLS_VER}"
          mkdir -p apk-tools-src
          tar xzf apk-tools.tar.gz -C apk-tools-src --strip-components=1
          cd apk-tools-src
          meson setup -Dc_link_args="-static" -Dprefer_static=true -Ddefault_library=static build >/dev/null
          ninja -C build src/apk >/dev/null
          cp -f build/src/apk "$RUNNER_TEMP/apk"
          "$RUNNER_TEMP/apk" --version

      - name: Verify, re-sign and rebuild index (per directory)
        id: build_index
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/apk"
          PRIV="$RUNNER_TEMP/private-key.pem"
          KEYS="$RUNNER_TEMP/keys"
          BRANCH="${{ matrix.branch }}"
          cd "$GITHUB_WORKSPACE"

          # 找出所有含 apk 的目录（每层目录各一份索引）
          mapfile -t DIRS < <(find "$ARCH_ROOT" -maxdepth 3 -type d 2>/dev/null | sort | while read -r d; do
            compgen -G "$d/*.apk" >/dev/null && echo "$d"
          done)
          if [ ${#DIRS[@]} -eq 0 ]; then
            echo "::warning::${ARCH_ROOT} 下没有含 apk 的目录（分支 ${{ matrix.branch }} 还没有包），跳过本轮"
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo ">>> 需要重建索引的目录（${#DIRS[@]} 个）：${DIRS[*]}"

          total=0
          resigned_all=0
          all_same=1
          for DEST_REL in "${DIRS[@]}"; do
            DEST="$GITHUB_WORKSPACE/$DEST_REL"
            echo ""
            echo "=================== $DEST_REL ==================="
            cd "$DEST"
            shopt -s nullglob
            files=(*.apk)
            echo ">>> 目录内 apk 数量：${#files[@]}"
            total=$((total + ${#files[@]}))

            resigned=0
            bad=0
            for f in "${files[@]}"; do
              if "$APK" verify --keys-dir "$KEYS" "$PWD/$f" >/dev/null 2>&1; then
                continue
              fi
              echo ">>> 重签（原签名非本钥/缺失）：$f"
              if "$APK" adbsign --allow-untrusted --reset-signatures --sign-key "$PRIV" "$PWD/$f"; then
                resigned=$((resigned+1))
              else
                echo "::error::$f 重签失败"
                bad=$((bad+1))
              fi
            done
            echo ">>> 重签数量：$resigned，失败：$bad"
            [ "$bad" -eq 0 ] || exit 1
            resigned_all=$((resigned_all + resigned))

            # 重签后必须全部通过本钥校验，否则不允许发布索引
            if ! "$APK" verify --keys-dir "$KEYS" "${files[@]}"; then
              echo "::error::${DEST_REL} 仍有 apk 无法通过本钥验签，该目录索引未更新"
              exit 1
            fi

            echo ">>> 生成签名索引 packages.adb（$DEST_REL）"
            "$APK" mkndx --allow-untrusted --sign-key "$PRIV" \
                   --output "$RUNNER_TEMP/packages.adb" "${files[@]}"
            if ! "$APK" verify --keys-dir "$KEYS" "$RUNNER_TEMP/packages.adb"; then
              echo "::error::${DEST_REL} 新索引无法通过本钥验签"
              exit 1
            fi

            # 幂等判断：索引里的 (name,version,hashes) 集合与现网完全一致 → 该目录不提交
            "$APK" adbdump "$RUNNER_TEMP/packages.adb" > "$RUNNER_TEMP/new.dump" 2>/dev/null
            if [ -f packages.adb ]; then
              "$APK" adbdump packages.adb > "$RUNNER_TEMP/old.dump" 2>/dev/null || : > "$RUNNER_TEMP/old.dump"
            else
              : > "$RUNNER_TEMP/old.dump"
            fi
            awk '/^  - name: /{n=$0; sub(/^  - name: /,"",n); cur=n; v=""; h=""; next}
                 /^    version: /{v=$0; sub(/^    version: /,"",v); next}
                 /^    hashes: /{h=$0; sub(/^    hashes: /,"",h); if(cur!=""){print cur"|"v"|"h; cur=""}}' \
                 "$RUNNER_TEMP/old.dump" | sort > /tmp/old.norm
            awk '/^  - name: /{n=$0; sub(/^  - name: /,"",n); cur=n; v=""; h=""; next}
                 /^    version: /{v=$0; sub(/^    version: /,"",v); next}
                 /^    hashes: /{h=$0; sub(/^    hashes: /,"",h); if(cur!=""){print cur"|"v"|"h; cur=""}}' \
                 "$RUNNER_TEMP/new.dump" | sort > /tmp/new.norm
            if cmp -s /tmp/old.norm /tmp/new.norm; then same=1; else same=0; fi
            echo ">>> ${DEST_REL}: 旧索引 $(wc -l < /tmp/old.norm) 个包 / 新索引 $(wc -l < /tmp/new.norm) 个包，内容一致=$same"
            cp -f "$RUNNER_TEMP/packages.adb" packages.adb
            sha256sum ./*.apk > SHA256SUMS
            {
              printf 'PonWrt apk 仓库目录 %s\n' "$DEST_REL"
              printf '包数量：%s（本次重签 %s 个）\n' "${#files[@]}" "$resigned"
              printf '索引：packages.adb（本钥签名，设备免 --allow-untrusted）\n'
              printf '公钥：仓库根 public-key.pem；设备侧放 /etc/apk/keys/public-key.pem\n'
              printf '源地址（repositories.d 里写这一整条）：\n'
              printf 'https://raw.githubusercontent.com/ufo1cn/ponwrt-apk-repo/%s/%s/packages.adb\n' "$BRANCH" "$DEST_REL"
            } > README.txt
            [ "$same" = "1" ] || all_same=0
            shopt -u nullglob
          done
          cd "$GITHUB_WORKSPACE"

          echo "skipped=0" >> "$GITHUB_OUTPUT"
          echo "index_same=$all_same" >> "$GITHUB_OUTPUT"
          echo "resigned=$resigned_all" >> "$GITHUB_OUTPUT"
          echo "apk_count=$total" >> "$GITHUB_OUTPUT"
          echo "dirs=${#DIRS[@]}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: (steps.build_index.outputs.skipped != '1') && (steps.build_index.outputs.index_same == '0' || inputs.force || github.event_name != 'schedule')
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.email "ci@ponwrt"
          git config user.name "ponwrt-apk-ci"
          git add -A
          if git diff --cached --quiet; then
            echo ">>> 无变更，跳过提交"
            exit 0
          fi
          git commit -m "reindex(${{ matrix.branch }}): dirs=${{ steps.build_index.outputs.dirs }} apk=${{ steps.build_index.outputs.apk_count }} resigned=${{ steps.build_index.outputs.resigned }} same=${{ steps.build_index.outputs.index_same }} [skip ci]"
          for i in 1 2 3 4; do
            if git push origin HEAD:${{ matrix.branch }}; then
              echo ">>> 已推送到 ${{ matrix.branch }} 分支"
              exit 0
            fi
            echo ">>> 推送被拒（上游有新提交），第 $i 次 rebase 重试"
            git fetch origin ${{ matrix.branch }}
            git rebase origin/${{ matrix.branch }} || { echo "::error::rebase 冲突，需人工处理"; exit 1; }
          done
          echo "::error::推送失败（重试 4 次）"
          exit 1

      - name: Mirror snapshot to Gitee (single commit)
        # 只镜像当前内容：单提交 + 强推，Gitee 分支永远只有 1 个 commit，体积≈当前文件量。
        # 内容没变就不推（用 .snapshot-id 比对，只读一个几百字节的文件，不拉整仓）。
        if: steps.build_index.outputs.skipped != '1'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          BRANCH: ${{ matrix.branch }}
        run: |
          set -uo pipefail
          if [ -z "${GITEE_TOKEN:-}" ] || [ -z "${GITEE_REPO:-}" ] || [ -z "${GITEE_USER:-}" ]; then
            echo "::warning::未配置 secrets GITEE_USER / GITEE_TOKEN 或变量 GITEE_REPO，跳过 Gitee 镜像"
            exit 0
          fi
          owner="${GITEE_REPO%%/*}"
          name="${GITEE_REPO##*/}"
          echo ">>> 镜像分支 $BRANCH -> gitee.com/$GITEE_REPO"

          # 1) 生成单提交快照（只含当前文件，不带任何历史）
          rm -rf /tmp/snap && mkdir -p /tmp/snap
          tar -C "$GITHUB_WORKSPACE" --exclude=.git -cf - . | tar -C /tmp/snap -xf -
          cd /tmp/snap
          manifest=$(find . -type f ! -name '.snapshot-id' -print0 | sort -z \
            | xargs -0 -r sha256sum | sed 's#  \./#  #' | sha256sum | cut -d' ' -f1)
          printf '%s\n' "$manifest" > .snapshot-id

          # 2) 远端内容一致就跳过（Gitee API 只读 .snapshot-id）
          remote=$(curl -fsS --max-time 20 -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${owner}/${name}/contents/.snapshot-id?ref=${BRANCH}" 2>/dev/null \
            | python3 -c 'import base64,json,sys
          d=json.load(sys.stdin)
          print(base64.b64decode(d["content"]).decode("utf-8").strip())' 2>/dev/null || true)
          if [ "$remote" = "$manifest" ]; then
            echo ">>> Gitee/$BRANCH 与本地一致（${manifest:0:12}），跳过上传"
            exit 0
          fi

          # 3) 单提交 + 强推：旧内容整条分支被替换，历史不累积
          git init -q .
          git config user.email ci@ponwrt
          git config user.name ponwrt-ci
          git add -A
          git commit -qm "snapshot(${BRANCH}): $(date -u +%Y-%m-%dT%H:%MZ) manifest=${manifest:0:12}"
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          if git push --force gitee "HEAD:refs/heads/${BRANCH}"; then
            echo ">>> 已强推 Gitee/$BRANCH（单提交快照 manifest=${manifest:0:12}）"
          else
            echo "::error::推送 Gitee 失败：检查 token 权限 / 分支保护 / 仓库是否存在"
            exit 1
          fi

